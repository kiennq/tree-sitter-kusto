[package]
name = "tree-sitter-kusto"
description = "Kusto Query Language (KQL) grammar for tree-sitter"
version = "1.0.0"
authors = ["Amaan Qureshi"]
license = "MIT"
keywords = ["incremental", "parsing", "tree-sitter", "kusto"]
categories = ["parser-implementations", "parsing", "text-editors"]
repository = "https://github.com/kiennq/tree-sitter-kusto"
edition = "2021"
autoexamples = false

build = "bindings/rust/build.rs"
include = [
  "bindings/rust/*",
  "/grammar.js",
  "queries/*",
  "src/*",
  "tree-sitter.json",
  "/LICENSE",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.26.11"

[[test]]
name = "parse"
path = "bindings/rust/tests/parse.rs"
